name: Build candidate ISO images
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Architecture to build (one ISO at a time)
        required: true
        type: choice
        default: aarch64
        options: [aarch64, x86_64]
  pull_request:
    paths:
      - 'VERSION'
      - 'builder/**'
      - 'custom-overlay/**'
      - 'void-mklive/**'
      - '.github/workflows/build-iso.yml'
permissions:
  contents: read
jobs:
  desktop-tests:
    name: Desktop script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # migration tests read old file versions from git history
      - name: Run desktop tests
        run: python3 -m unittest discover -s tests -v
  void-package-names:
    name: Installer packages exist in live Void
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every offered package against the live x86_64 and aarch64 repodata
        run: |
          d=$RUNNER_TEMP/repodata; base=https://repo-default.voidlinux.org/current; mkdir -p "$d"
          for f in x86_64-repodata nonfree/x86_64-repodata aarch64/aarch64-repodata aarch64/nonfree/aarch64-repodata; do
            curl -fsSL --retry 3 -o "$d/$(echo "${f#aarch64/}" | tr / -)" "$base/$f"
          done
          ABYSS_VOID_REPODATA="$d" python3 -m unittest -v tests.test_software_packages.PackageNamesTest
  build:
    needs: desktop-tests
    name: Build ${{ matrix.arch }} ISO
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arch: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.architecture) || '["aarch64","x86_64"]') }}
    container:
      image: ghcr.io/void-linux/void-mklive:20250116R1
      options: --privileged
      volumes:
        - /dev:/dev
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build container
        shell: sh
        run: xbps-install -Syu xbps && xbps-install -yu && xbps-install -y curl xorriso squashfs-tools
      - name: Wait for published package update
        shell: bash
        run: |
          repo=https://mrzakaria.github.io/AbyssLinuxPMR/current
          for attempt in $(seq 1 90); do
            if curl -fsI "$repo/abyss-desktop-1.0_37.${{ matrix.arch }}.xbps" >/dev/null && \
               curl -fsI "$repo/abyss-slock-1.7_2.${{ matrix.arch }}.xbps" >/dev/null && \
               curl -fsI "$repo/abyss-st-0.9.3_2.${{ matrix.arch }}.xbps" >/dev/null && \
               curl -fsI "$repo/abyss-dwm-6.8_10.${{ matrix.arch }}.xbps" >/dev/null && \
               curl -fsI "$repo/abyss-theme-1.0_7.${{ matrix.arch }}.xbps" >/dev/null && \
               curl -fsI "$repo/abyss-boot-1.0_1.${{ matrix.arch }}.xbps" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo 'Required signed PMR packages were not published in time' >&2
          exit 1
      - name: Build image
        shell: bash
        run: bash builder/build-one-ci.sh '${{ matrix.arch }}'
      - name: Check ISO structure and checksum
        shell: bash
        run: |
          set -euo pipefail
          file=$(find out -name '*.iso' -type f -print -quit)
          test -n "$file" && test -s "$file"
          xorriso -indev "$file" -find / -type f -exec lsdl -- > out/iso-files.txt
          grep -i 'squashfs.img' out/iso-files.txt
          xorriso -indev "$file" -report_el_torito plain 2>&1 | grep -i 'UEFI'
          (cd out && sha256sum *.iso > SHA256SUMS)
      - name: Audit installed packages and overlay
        shell: bash
        run: bash builder/audit-iso.sh "$(find out -name '*.iso' -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: abyss-iso-${{ matrix.arch }}
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
