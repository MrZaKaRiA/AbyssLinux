# ~/.config/mpv/mpv.conf - Abyss Linux media player defaults
# Opened from lf (Enter on a video/audio file) or: mpv <file|url>

keep-open=yes
save-position-on-quit=yes
hwdec=auto-safe
# falls back to plain X11 output when the VM has no 3D acceleration
vo=gpu,x11

osd-font="JetBrainsMono Nerd Font"
osd-color="#f3e8ff"
osd-border-color="#0d0b18"
osd-bar-align-y=0.9
sub-auto=fuzzy
