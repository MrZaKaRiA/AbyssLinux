# ~/.config/abyss/keyboard.conf - read by /usr/local/bin/abyss-keyboard
# Applied at every X start; run `abyss-keyboard` to re-apply after editing.

MODEL=pc105
LAYOUTS="us,ara"            # first layout must stay latin so dwm keys keep working
VARIANTS=",digits"          # Arabic with 0-9 digits
TOGGLE="grp:alt_shift_toggle"
CAPS="caps:escape"          # or caps:swapescape / ctrl:nocaps

# Super (Mod4) on Left Alt instead of Win/Cmd:
#   0 = Win/Cmd key (default), 1 = Left Alt, auto = Left Alt only inside a VM
SWAP_SUPER=0
