# Abyss Linux - default keyboard for every X11 keyboard (incl. hotplugged ones)
#   English + Arabic (Western digits), Alt+Shift toggles, Caps Lock = Escape.
# Per-user overrides live in ~/.config/abyss/keyboard.conf (abyss-keyboard).
Section "InputClass"
    Identifier      "abyss-keyboard-defaults"
    MatchIsKeyboard "on"
    Option          "XkbModel"   "pc105"
    Option          "XkbLayout"  "us,ara"
    Option          "XkbVariant" ",digits"
    Option          "XkbOptions" "grp:alt_shift_toggle,caps:escape,grp_led:scroll"
EndSection
