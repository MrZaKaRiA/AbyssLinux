# /etc/doas.conf - Abyss Linux (OpenDoas). Must stay root:root, mode 0400.
# Members of wheel may run commands as root; the password is cached per tty.
permit persist keepenv :wheel

# Power management without a password (used by the Abyss menu fallback
# when elogind/loginctl is not available).
permit nopass :wheel as root cmd reboot
permit nopass :wheel as root cmd poweroff
permit nopass :wheel as root cmd zzz
permit nopass :wheel as root cmd ZZZ

# abyss-power (menu, poweroff/reboot aliases) validates its own arguments
permit nopass :wheel as root cmd /usr/local/bin/abyss-power
