# Abyss Linux login screen: the boot artwork, the user already picked and the
# password box at the bottom centre, so boot -> login -> desktop looks like
# one continuous screen.
[greeter]
background=/usr/share/backgrounds/abyss/abyss-splash.png
user-background=false
theme-name=Abyss
icon-theme-name=Abyss
font-name=JetBrainsMono Nerd Font 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
default-user-image=#avatar-default-symbolic
hide-user-image=false
round-user-image=true
# x: centred; y: 86 % down the screen, measured from the box's bottom edge
position=50%,center 86%,end
# only a shutdown/restart button, no clock or host name clutter
indicators=~spacer;~power
screensaver-timeout=0
