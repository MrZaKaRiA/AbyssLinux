# Abyss Linux display manager settings (the main lightdm.conf stays stock;
# on the live ISO the boot hook only fills in its autologin-* lines there).
[Seat:*]
greeter-session=lightdm-gtk-greeter
user-session=abyss
greeter-hide-users=false
greeter-show-manual-login=false
allow-guest=false
# Keep whatever is on screen (the boot splash) until the greeter draws:
# LightDM takes over from plymouth with "quit --retain-splash" itself.
xserver-command=X -background none -nolisten tcp
# Same text size on the login screen as on the desktop (HiDPI aware)
display-setup-script=/usr/local/bin/abyss-display-setup
